<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%" fill="none">
  <!-- Left Icon Group: Yellow Badge, Hanger, Shirt & Swoosh -->
  <g transform="translate(10, 10)">
    <!-- Hanger Hook -->
    <path d="M 98 48 C 98 32, 114 22, 126 34 C 134 42, 126 54, 124 62 L 124 72" 
          stroke="#FACC15" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Outer Yellow Circle Frame -->
    <path d="M 64 165 C 38 140, 36 95, 60 66 C 88 32, 142 30, 174 58 C 202 82, 206 126, 184 156" 
          stroke="#FACC15" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Hanger Body Triangle -->
    <path d="M 72 108 L 124 72 L 176 108" 
          stroke="#FACC15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- T-Shirt Minimalist Outline -->
    <path d="M 88 116 L 76 128 L 92 144 L 100 136 L 100 162 L 148 162 L 148 136 L 156 144 L 172 128 L 160 116 C 148 126, 100 126, 88 116 Z" 
          stroke="#FACC15" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none" />
    
    <!-- Dynamic Swoosh through bottom -->
    <path d="M 45 186 C 80 162, 130 148, 192 122 C 160 188, 95 198, 45 186 Z" 
          fill="#FACC15" />
    <path d="M 45 186 C 100 162, 145 142, 202 118" 
          stroke="#FACC15" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Typography: "Out" "fit" "Premium" -->
  <!-- "Out" in Dark/Black or White -->
  <text x="245" y="132" font-family="'Playfair Display', 'Bodoni MT', 'Didot', Georgia, serif" font-weight="900" font-size="82" fill="#111111" letter-spacing="-1">Out</text>
  
  <!-- "fit" in Golden Yellow -->
  <text x="405" y="132" font-family="'Playfair Display', 'Bodoni MT', 'Didot', Georgia, serif" font-weight="900" font-size="82" fill="#FACC15" letter-spacing="-1">fit</text>

  <!-- Dotted line under "Out" -->
  <line x1="248" y1="156" x2="385" y2="156" stroke="#111111" stroke-width="3.5" stroke-dasharray="2 7" stroke-linecap="round" />

  <!-- "Premium" under "fit" -->
  <text x="395" y="162" font-family="'Playfair Display', 'Bodoni MT', 'Didot', Georgia, serif" font-weight="600" font-size="28" fill="#111111" letter-spacing="1">Premium</text>
</svg>
